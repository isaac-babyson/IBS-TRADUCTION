<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f2f5;display:flex;justify-content:center;font-family:system-ui;color:#111}
.app{width:100%;max-width:460px;min-height:100vh;background:#fff;display:flex;flex-direction:column;padding-bottom:78px}
.top{height:60px;background:#0866ff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#fff;position:sticky;top:0;z-index:99}
.top button{width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;font-weight:900}
.page{display:none;flex:1;flex-direction:column;overflow:auto;background:#f0f2f5}.page.show{display:flex}
.card{border-radius:12px;padding:14px;background:#fff;border:1px solid #ddd;margin:8px 10px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card.dark{background:#0f1a33;color:#fff;border:none}
.mic{width:100%;height:56px;border-radius:28px;border:none;background:#0866ff;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.mic.green{background:#00a400}
.mic.rec{background:#ff3344}
.input{width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#111;margin:6px 0}
.btn{width:100%;padding:12px;border-radius:8px;border:none;background:#0866ff;color:#fff;font-weight:900;margin:6px 0}
.btn.white{background:#e4e6eb;color:#111}
.row{padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;cursor:pointer;background:#fff}
.badge{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:900;background:#0866ff;color:#fff}
.badge.gold{background:gold;color:#000;border:1px solid #daa520}
.badge.gray{background:#e4e6eb;color:#65676b}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#0866ff,#00a400);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;overflow:hidden;flex-shrink:0}
.avatar.gold{border:3px solid gold;box-shadow:0 0 10px gold}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.nav button{background:none;border:none;color:#65676b;font-size:11px;display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:8px}.nav button.on{background:#e7f3ff;color:#0866ff}.nav button span{font-size:22px}
.verified-badge{display:inline-flex;align-items:center;gap:4px;background:gold;color:#000;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:900;border:1px solid #daa520}
.verified-badge.admin{background:linear-gradient(135deg,gold,#ffd700);box-shadow:0 0 8px gold}
