<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f2f5;font-family:system-ui;color:#111;overflow-x:hidden}
.app{width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:#f0f2f5;display:flex;flex-direction:column;padding-bottom:70px}
.top{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:90}
.top-left{display:flex;align-items:center;gap:8px}
.ibs-logo{color:#0a1430;font-weight:900;font-size:19px;line-height:1}
.ibs-logo span{color:#0866ff}
.top-actions{display:flex;gap:8px}
.top-actions button{width:40px;height:40px;border-radius:50%;border:none;background:#e4e6eb;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icons-bar{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-around;border-bottom:1px solid #ddd;position:sticky;top:56px;z-index:89}
.icon{width:50px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:none;background:none;font-size:22px;cursor:pointer;color:#65676b}
.icon.on{color:#0866ff;background:#e7f3ff}
.profile-top{background:#fff;padding:12px;border-bottom:8px solid #f0f2f5;display:flex;gap:12px;align-items:flex-start}
.avatar-big{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#0866ff,#00a400);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:26px;overflow:hidden;flex-shrink:0;border:3px solid gold}
.composer{background:#fff;padding:12px;border-bottom:8px solid #f0f2f5}
.composer-row{display:flex;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0866ff,#00a400);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;overflow:hidden;flex-shrink:0}
.avatar.gold{border:3px solid gold}
.composer-row input{flex:1;background:#f0f2f5;border:none;border-radius:20px;padding:12px 14px;font-size:14px}
.photo-video-actions{display:flex;gap:8px;margin-top:10px}
.photo-video-actions button{flex:1;padding:10px;border-radius:20px;border:none;background:#e4e6eb;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.card{border-radius:12px;padding:14px;background:#fff;border:1px solid #ddd;margin:8px 10px}
.card.dark{background:#0f1a33;color:#fff;border:none}
.mic{width:100%;height:52px;border-radius:28px;border:none;background:#0866ff;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mic.green{background:#00a400}
.mic.rec{background:#ff3344;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.input{width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#111;margin:6px 0}
.btn{width:100%;padding:12px;border-radius:8px;border:none;background:#0866ff;color:#fff;font-weight:900;margin:6px 0}
.badge{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:900;background:#0866ff;color:#fff}
.badge.gold{background:gold;color:#000;border:1px solid #daa520}
.verified-badge{background:gold;color:#000;padding:4px 10px;border-radius:12px;font-size:10px;font-weight:900;border:1px solid #daa520}
.page{display:none;flex:1;flex-direction:column;overflow:auto;background:#f0f2f5}.page.show{display:flex}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:999;padding:16px}.modal.show{display:flex}
.modal-box{width:100%;max-width:460px;background:#fff;border-radius:20px;padding:0;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
.modal-header{padding:16px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;font-weight:900}
.modal-content{flex:1;overflow:auto;padding:16px;background:#f0f2f5}
.settings-card{background:#fff;border-radius:12px;margin:0 0 8px 0;padding:14px;border:1px solid #ddd}
.post{background:#fff;margin:8px;border-radius:12px;border:1px solid #ddd;overflow:hidden}
.post img, .post video{width:100%;max-height:380px;object-fit:cover;display:block}
.post-head{padding:12px;display:flex;gap:10px;align-items:center}
.welcome{position:fixed;inset:0;background:linear-gradient(135deg,#0a1430 0%,#0866ff 100%);z-index:10000;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.welcome.show{display:flex}
.welcome-box{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);max-height:95vh;overflow:auto}
.search-bar{background:#fff;padding:10px;border-bottom:1px solid #ddd;display:none;gap:8px}
.search-bar.show{display:flex}
.search-bar input{flex:1;background:#f0f2f5;border:none;border-radius:20px;padding:12px 14px}
.realtime{width:8px;height:8px;background:#31a24c;border-radius:50%;display:inline-block}
.row{padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;cursor:pointer;background:#fff}
</style>
</head>
